# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-24.04

steps:
  - checkout: self

  - script: docker build --platform linux/amd64 -t my-first-app:$(Build.SourceVersion) .
    displayName: Build image

  - script: docker image inspect my-first-app:$(Build.SourceVersion) --format '{{.Architecture}}'
    displayName: Check architecture