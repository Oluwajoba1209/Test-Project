name: Build and deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: devopslearningacr123.azurecr.io
  IMAGE: my-first-app
  RESOURCE_GROUP: devops-learning-rg
  WEBAPP: my-first-devops-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the registry
        run: az acr login --name devopslearningacr123

      - name: Build and push image
        run: |
          docker build --platform linux/amd64 --provenance=false -t $REGISTRY/$IMAGE:${{ github.sha }} .
          docker push $REGISTRY/$IMAGE:${{ github.sha }}

      - name: Deploy to App Service
        run: |
          az webapp config set --resource-group $RESOURCE_GROUP --name $WEBAPP \
            --linux-fx-version "DOCKER|$REGISTRY/$IMAGE:${{ github.sha }}"