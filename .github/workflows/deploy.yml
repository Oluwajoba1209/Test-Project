name: Build and deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: devopslearningacr123.azurecr.io
  IMAGE: my-first-app
  RESOURCE_GROUP: devops-learning-rg
  CLUSTER: devops-learning-aks

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the registry
        run: az acr login --name devopslearningacr123

      - name: Build and push image
        run: |
          docker build --platform linux/amd64 --provenance=false -t $REGISTRY/$IMAGE:${{ github.sha }} .
          docker push $REGISTRY/$IMAGE:${{ github.sha }}

      - name: Connect to the cluster
        run: az aks get-credentials --resource-group $RESOURCE_GROUP --name $CLUSTER

      - name: Deploy to AKS
        run: |
          kubectl set image deployment/my-first-app my-first-app=$REGISTRY/$IMAGE:${{ github.sha }}
          kubectl rollout status deployment/my-first-app --timeout=120s